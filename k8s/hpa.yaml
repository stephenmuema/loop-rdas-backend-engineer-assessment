apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rdas-app
  namespace: rdas
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rdas-app
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
