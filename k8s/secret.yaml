apiVersion: v1
kind: Secret
metadata:
  name: rdas-secret
  namespace: rdas
type: Opaque
# stringData for readability during the assessment. In production use Sealed
# Secrets, the External Secrets Operator, or Vault - never commit real values.
stringData:
  DB_USERNAME: "rdas"
  DB_PASSWORD: "rdas"
  MYSQL_ROOT_PASSWORD: "rootpass"
